<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hardline — RouterOS security scan{% endblock %}</title>
<meta name="description" content="Paste your MikroTik RouterOS export. Get a graded security report and copy-paste fixes in seconds. Nothing is stored.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="6" stroke="var(--accent)" stroke-width="2"/><path d="M8 14h12M14 8v12" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span>HARDLINE</span>
  </a>
  <div class="nav-right">{% block nav %}
    <a class="nav-link" href="/#how">How it works</a>
    <a class="nav-link" href="/#fleet">Fleet</a>
    <a class="nav-link" href="https://synetix.co.za">Synetix</a>
  {% endblock %}</div>
</nav>
<main class="main">
{% block body %}{% endblock %}
</main>
<footer class="foot" id="fleet">
  <span>More than one router? <a href="mailto:hello@synetix.co.za?subject=Hardline%20fleet"><b>Fleet</b></a> rescans every box on a schedule and messages you the morning a new advisory drops.</span>
  <span class="mono">v{{ version }} · {{ rules }} checks · Synetix, Johannesburg</span>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && python -m pytest -q

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: hardline-windows.zip
          - os: macos-latest
            asset: hardline-macos
          - os: ubuntu-latest
            asset: hardline-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - name: Build single-file executable
        shell: bash
        run: |
          SEP=":"; [[ "$RUNNER_OS" == "Windows" ]] && SEP=";"
          pyinstaller --onefile --name hardline --console \
            --add-data "hardline/templates${SEP}hardline/templates" \
            --add-data "hardline/static${SEP}hardline/static" \
            --collect-submodules hardline \
            launcher.py
          ls -la dist
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/hardline; [[ "$RUNNER_OS" == "Windows" ]] && BIN=dist/hardline.exe
          chmod +x "$BIN" || true
          HARDLINE_AI=0 "$BIN" scan fixtures/hardened.rsc
      - name: Package asset
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp FIRST-RUN.txt dist/ && (cd dist && 7z a -tzip "${{ matrix.asset }}" hardline.exe FIRST-RUN.txt >/dev/null)
          else
            mv dist/hardline "dist/${{ matrix.asset }}"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.asset }}", path: "dist/${{ matrix.asset }}" }

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/synetix-io/hardline:latest
            ghcr.io/synetix-io/hardline:${{ github.ref_name }}

  release:
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "hardline-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Run locally, nothing leaves your machine.**
            - Windows: download `hardline-windows.zip`, unzip, double-click `hardline.exe` (SmartScreen: More info → Run anyway), the app opens at http://127.0.0.1:8080
            - macOS / Linux: download, `chmod +x hardline-*`, run it
            - Docker: `docker run --rm -p 8080:8080 ghcr.io/synetix-io/hardline`
            - Python: `pip install git+https://github.com/synetix-io/hardline` then `hardline`

            Unsigned binaries: Windows SmartScreen will ask once ("More info → Run anyway"). The source is this repository.

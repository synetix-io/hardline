[project]
name = "hardline"
version = "0.2.1"
description = "Paste your RouterOS export. Get a graded security report and a copy-paste fix."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hardline = "hardline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hardline*"]

[tool.setuptools.package-data]
hardline = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
